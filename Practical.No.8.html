<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">

        <h2 class="text-2xl font-bold mb-5 text-center">
            Student Registration
        </h2>

        <form id="registrationForm">

            <!-- Name -->
            <label class="block font-medium mb-1">Student Name</label>
            <input type="text" id="name"
                class="w-full border p-2 mb-3 rounded">

            <!-- Email -->
            <label class="block font-medium mb-1">Email</label>
            <input type="text" id="email"
                class="w-full border p-2 mb-3 rounded">

            <!-- Password -->
            <label class="block font-medium mb-1">Password</label>
            <input type="password" id="password"
                class="w-full border p-2 mb-3 rounded">

            <!-- Mobile -->
            <label class="block font-medium mb-1">Mobile Number</label>
            <input type="text" id="mobile"
                class="w-full border p-2 mb-4 rounded">

            <button type="submit"
                class="w-full bg-blue-500 text-white p-2 rounded">
                Register
            </button>
            <button type="button" id="showpassword"
                class="w-full bg-green-500 text-white p-2 rounded mt-2">
                Show Password
            </button>
            <p id="message" class="mt-4 text-center"></p>

        </form>
    </div>


    <script>
        
        const passwordInput = document.getElementById("password");
        const toggleButton = document.getElementById("showpassword");

        toggleButton.addEventListener("click", function() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleButton.textContent = "Hide Password";
                alert("Password is: " + passwordInput.value);
            } else {
                passwordInput.type = "password";
                toggleButton.textContent = "Show Password";
            }
        });


        // --- 2. FORM SUBMISSION LOGIC ---
        document.getElementById("registrationForm").onsubmit = function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let passwordValue = passwordInput.value; // Get the text value of the password field
            let mobile = document.getElementById("mobile").value;
            let message = document.getElementById("message");

            // Mandatory fields
            if (name == "" || email == "" || passwordValue == "" || mobile == "") {
                message.innerHTML = "Please fill all fields.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Email validation
            if (!email.includes("@") || !email.includes(".")) {
                message.innerHTML = "Enter a valid email.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Password validation
            if (passwordValue.length < 6 || !passwordValue.includes("@")) {
                message.innerHTML = "Password must be at least 6 characters and include a special character (@).";
                message.className = "mt-4 text-center text-red-500";
                return;
            }

            // Mobile validation
            if (mobile.length != 10 || isNaN(mobile)) {
                message.innerHTML = "Enter a valid 10-digit mobile number.";
                message.className = "mt-4 text-center text-red-500";
                return;
            }
           
            // Success
            message.innerHTML = "Registration Successful!";
            message.className = "mt-4 text-center text-green-500";
        };
    </script>

</body>
</html>
